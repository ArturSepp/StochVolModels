# SHARED CI CORE v1.0 — T2 — synced 2026-08-22
name: Examples

on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg
  TZ: UTC

jobs:
  quickstart:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Sync core environment
        run: uv sync --locked
      - name: Validate Colab mirror
        run: uv run --no-sync python scripts/check_quickstart_notebook.py
      - name: Run canonical offline example
        run: uv run --no-sync python examples/getting_started/quickstart.py

  oca-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Sync research integration environment
        run: uv sync --locked --extra research --group test
      - name: Run deterministic OCA contracts
        run: >-
          uv run --no-sync pytest
          src/stochvolmodels/tests/test_oca_option_chain_adapter.py
          src/stochvolmodels/tests/test_cboe_option_data_optional.py -v
