# SHARED CI CORE v1.0 — T2 — synced 2026-08-22
name: Offline replication

on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg
  TZ: UTC

jobs:
  logsv-paper-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Sync locked test environment
        run: uv sync --locked --group test
      - name: Run committed-input LogSV replication contracts
        run: uv run --no-sync pytest -m paper_replication -v
