name: JOSS paper

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - paper.md
      - paper.bib
      - docs/audit/joss_evidence.json
      - docs/audit/joss_authorship.json
      - docs/audit/ai_use.json
      - docs/audit/research_impact.json
      - scripts/joss_audit.py
      - .github/workflows/joss-paper.yml
  pull_request:
    paths:
      - paper.md
      - paper.bib
      - docs/audit/joss_evidence.json
      - docs/audit/joss_authorship.json
      - docs/audit/ai_use.json
      - docs/audit/research_impact.json
      - scripts/joss_audit.py
      - .github/workflows/joss-paper.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a7345e0508bb808b80e45ac5f06b551ea02aa727 # v6.2.0
        with:
          python-version: "3.12"
      - name: Validate manuscript structure and citations
        run: python scripts/check_joss_paper.py

  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a7345e0508bb808b80e45ac5f06b551ea02aa727 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install package and test tools
        run: python -m pip install -e ".[dev]"
      - name: Verify paper claims and stable API evidence
        run: python -m pytest src/stochvolmodels/tests/test_joss_evidence.py -v

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the JOSS draft PDF
        uses: openjournals/openjournals-draft-action@85a18372e48f551d8af9ddb7a747de685fbbb01c
        with:
          journal: joss
          paper-path: paper.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stochvolmodels-joss-paper
          path: paper.pdf
