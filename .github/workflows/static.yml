name: Static

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.12"
      - name: Check correctness and dependency boundaries
        run: >-
          uv run --locked --only-group lint ruff check
          --select F,TID251,TID253,ICN src/stochvolmodels
      - name: Check stable docstring coverage
        if: ${{ !cancelled() }}
        run: uv run --locked --only-group lint interrogate -v src/stochvolmodels
