# SHARED CI CORE v1.0 — T2 — synced 2026-08-22
name: Static

on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Check correctness and dependency boundaries
        run: >-
          uv run --locked --only-group lint ruff check
          --select F,TID251,TID253,ICN src/stochvolmodels
      - name: Check stable docstring coverage
        if: ${{ !cancelled() }}
        run: uv run --locked --only-group lint interrogate -v src/stochvolmodels
      - name: Check fitter annotations and explanatory headers
        if: ${{ !cancelled() }}
        run: uv run --locked --only-group lint python scripts/check_fitter_contracts.py
