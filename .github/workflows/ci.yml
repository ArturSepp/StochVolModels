name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg
  TZ: UTC

jobs:
  linux-source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync locked primary environment
        if: matrix.python-version == '3.12'
        run: uv sync --extra dev --locked

      - name: Resolve current compatibility environment
        if: matrix.python-version != '3.12'
        run: uv sync --extra dev --upgrade

      - name: Run fast source tests
        if: matrix.python-version != '3.12'
        run: uv run --no-sync pytest -m "not slow" -v

      - name: Run authoritative source tests with coverage
        if: matrix.python-version == '3.12'
        run: >-
          uv run --no-sync pytest -m "not slow"
          --cov=stochvolmodels --cov-report=term-missing --cov-report=json:coverage.json

      - name: Enforce stable coverage scope
        if: matrix.python-version == '3.12'
        run: uv run --no-sync python scripts/check_coverage_scopes.py coverage.json

      - name: Upload coverage diagnostics
        if: matrix.python-version == '3.12' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stochvolmodels-coverage
          path: coverage.json

  windows-numerical-regression:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.12"

      - name: Sync locked test environment
        run: uv sync --extra dev --locked

      - name: Run fast source tests
        run: uv run --no-sync pytest -m "not slow" -v

      - name: Run numerical regressions
        run: uv run --no-sync pytest -m slow -v

  macos-source-smoke:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.12"

      - name: Sync locked test environment
        run: uv sync --extra dev --locked

      - name: Run fast source tests
        run: uv run --no-sync pytest -m "not slow" -v

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.12"
      - name: Build and inspect wheel
        run: |
          uv build --wheel --out-dir dist
          uv run --no-project python scripts/check_wheel_contents.py dist/*.whl
      - name: Install core wheel and test tools in a clean environment
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/wheelcheck-venv"
          uv pip install --python "$RUNNER_TEMP/wheelcheck-venv/bin/python" dist/*.whl pytest pytest-regressions
      - name: Run complete installed-package suite outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/wheelcheck"
          cd "$RUNNER_TEMP/wheelcheck"
          "$RUNNER_TEMP/wheelcheck-venv/bin/python" -m pytest --pyargs stochvolmodels -m "not slow" -q
      - name: Verify installed metadata and quickstart
        run: |
          cd "$RUNNER_TEMP/wheelcheck"
          "$RUNNER_TEMP/wheelcheck-venv/bin/python" -c "import importlib.metadata as m, stochvolmodels as s; assert s.__version__ == m.version('stochvolmodels')"
          "$RUNNER_TEMP/wheelcheck-venv/bin/python" "$GITHUB_WORKSPACE/examples/getting_started/quickstart.py"
