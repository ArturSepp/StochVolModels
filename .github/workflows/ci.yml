# SHARED CI CORE v1.0 — T2 — synced 2026-08-22
name: CI
run-name: ${{ (github.event_name == 'schedule' || inputs.live_dependencies) && 'Dependency compatibility (live resolution)' || 'CI' }}

permissions:
  contents: read

on:
  workflow_call:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      live_dependencies:
        description: Resolve current dependencies as in scheduled CI
        type: boolean
        default: false

env:
  # FontTools 4.69.0 shipped only a few CPython 3.11 wheels and no source archive.
  LIVE_UPGRADE_ARGS: --upgrade --upgrade-package fonttools!=4.69.0
  UV_HTTP_RETRIES: "5"
  UV_HTTP_TIMEOUT: "60"
  PIP_RETRIES: "5"
  PIP_TIMEOUT: "60"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg
  TZ: UTC

jobs:
  linux-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync locked primary environment
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if uv sync --group test --extra research --locked; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then echo "::error::uv sync failed after 3 attempts"; exit 1; fi
            delay=$((attempt * 30 - 15))
            echo "::warning::uv sync attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
          done

      - name: Resolve current compatibility environment
        if: matrix.python-version != '3.12'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if uv sync --group test ${{ (github.event_name == 'schedule' || inputs.live_dependencies) && env.LIVE_UPGRADE_ARGS || '--locked' }}; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then echo "::error::uv sync failed after 3 attempts"; exit 1; fi
            delay=$((attempt * 30 - 15))
            echo "::warning::uv sync attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
          done

      - name: Run fast source tests
        if: matrix.python-version != '3.12'
        run: uv run --no-sync pytest -m "not slow" -v

      - name: Run authoritative source tests with coverage
        if: matrix.python-version == '3.12'
        run: >-
          uv run --no-sync pytest -m "not slow"
          --cov=stochvolmodels --cov-report=term-missing --cov-report=json:coverage.json

      - name: Verify portable PDE fixtures and Black prices
        if: matrix.python-version == '3.12'
        run: >-
          uv run --no-sync pytest
          src/stochvolmodels/tests/test_lsv_production_stress.py::test_frozen_calls_expiry_diagnostics_and_decisions
          src/stochvolmodels/tests/test_local_vol_pde_pricer.py::test_bucketed_black_prices_and_refinement

      - name: Enforce stable coverage scope
        if: matrix.python-version == '3.12'
        run: uv run --no-sync python scripts/check_coverage_scopes.py coverage.json

      - name: Upload coverage diagnostics
        if: matrix.python-version == '3.12' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stochvolmodels-coverage
          path: coverage.json

  linux-pde-reference:
    name: Historical LSV comparisons
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Sync locked test and research dependencies
        run: uv sync --locked --group test --extra research
      - name: Compare the public engine with the historical LSV implementation
        run: uv run --no-sync pytest -m pde_reference

  windows-source:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"

      - name: Sync locked test environment
        run: uv sync --group test --locked

      - name: Run fast source tests
        run: uv run --no-sync pytest -m "not slow" -v

  windows-numerical:
    uses: ./.github/workflows/windows-numerical.yml
    with:
      revision: ${{ github.sha }}

  linux-slow-doc-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        case:
          - affine_expansion-PRICE_IMPACT
          - app_bitcoin_options-CALIBRATE
          - app_positive_and_negative_skews-REFIT_VIX
          - app_swaptions_and_sofr_options-SWAPTION_FIT
          - app_swaptions_and_sofr_options-SWAPTION_MONTE_CARLO
          - app_swaptions_and_sofr_options-SHOCK_SCENARIOS
          - calibration-REFIT
          - hawkes_jump_diffusion-MONTE_CARLO
          - logsv_model-BITCOIN_FORWARD_GREEKS
          - quadratic_variance_options-QV_OPTIONS

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"

      - name: Sync locked test environment
        run: uv sync --group test --locked

      - name: Run slow documentation example
        run: uv run --no-sync pytest -m slow -v "src/stochvolmodels/tests/test_docs_examples.py::test_documentation_script_case[${{ matrix.case }}]"

  macos-source-smoke:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"

      - name: Sync locked test environment
        run: uv sync --group test --locked

      - name: Run fast source tests
        run: uv run --no-sync pytest -m "not slow" -v

  wheel:
    name: built wheel (core install)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Build the wheel from the source distribution
        run: |
          uv build --sdist --clear --out-dir dist
          uv build --wheel dist/*.tar.gz --out-dir dist
      - name: Assert source and wheel contents
        run: |
          uv run --no-project python scripts/check_sdist_contents.py dist/*.tar.gz
          uv run --no-project python scripts/check_wheel_contents.py dist/*.whl
      - name: Install the core wheel with plain pip
        run: |
          "$(uv python find 3.12)" -m venv "$RUNNER_TEMP/wheelcheck-venv"
          "$RUNNER_TEMP/wheelcheck-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheelcheck-venv/bin/python" -m pip check
      - name: Verify core metadata and pricing outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/wheelcheck"
          cd "$RUNNER_TEMP/wheelcheck"
          "$RUNNER_TEMP/wheelcheck-venv/bin/python" -I -c "from importlib.util import find_spec; assert all(find_spec(name) is None for name in ('qis', 'option_chain_analytics'))"
          "$RUNNER_TEMP/wheelcheck-venv/bin/python" -I -c "import importlib.metadata as m, stochvolmodels as s; assert s.__version__ == m.version('stochvolmodels')"
          "$RUNNER_TEMP/wheelcheck-venv/bin/python" -I "$GITHUB_WORKSPACE/examples/getting_started/quickstart.py"
          "$RUNNER_TEMP/wheelcheck-venv/bin/python" -I "$GITHUB_WORKSPACE/examples/brc_local_vol.py"
          "$RUNNER_TEMP/wheelcheck-venv/bin/python" -I "$GITHUB_WORKSPACE/examples/accumulator_local_vol.py"
      - name: Run PDE examples against the installed core wheel
        run: |
          cd "$RUNNER_TEMP/wheelcheck"
          "$RUNNER_TEMP/wheelcheck-venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_pde_examples.py" --installed "$GITHUB_WORKSPACE/examples/docs/pde_solvers.py" "$GITHUB_WORKSPACE/examples/docs/local_volatility_and_lsv.py"

      - name: Run installed-package fast tests
        run: |
          cd "$RUNNER_TEMP/wheelcheck"
          "$RUNNER_TEMP/wheelcheck-venv/bin/python" -m pip install pytest pytest-regressions
          "$RUNNER_TEMP/wheelcheck-venv/bin/python" -I -m pytest --pyargs stochvolmodels -m "not slow" -q
      - name: Validate installed accumulator PDE and Monte Carlo references
        run: |
          cd "$RUNNER_TEMP/wheelcheck"
          "$RUNNER_TEMP/wheelcheck-venv/bin/python" -I -m pytest -m slow -q --pyargs stochvolmodels.tests.test_accumulator_pde stochvolmodels.tests.test_accumulator_mc

  stack-policy:
    name: stack import boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Exercise policy regressions
        run: python .github/scripts/check_stack_imports.py --self-test
      - name: Check stack imports and optional adapter isolation
        run: python .github/scripts/check_stack_imports.py

  lowest-dependencies:
    # Floor resolution is compatibility maintenance, not a verdict on an unrelated edit.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: lowest direct dependencies (Python 3.11, ${{ matrix.extras || 'core' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        extras: ["", "--extra research"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.11"
      - name: Keep the test environment outside the checkout
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/lowest-dependencies" >> "$GITHUB_ENV"
      - name: Resolve a fresh lowest-direct test environment
        # Upgrade ignores lockfile preference; this job never commits its experimental lock.
        run: uv sync --python 3.11 --resolution lowest-direct ${{ env.LIVE_UPGRADE_ARGS }} --group test ${{ matrix.extras }}
      - name: Record installed versions
        run: uv pip freeze --python "$UV_PROJECT_ENVIRONMENT/bin/python"
      - name: Check optional dependencies stay outside package-root import
        run: uv run --no-sync python .github/scripts/check_stack_imports.py --check-root
      - name: Test declared dependency floors without live provider credentials
        run: uv run --no-sync pytest -m "not slow"
