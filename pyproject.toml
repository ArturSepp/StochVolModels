[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stochvolmodels"
version = "2.20.0"
description = "Fourier-transform pricing, Monte Carlo validation, and calibration of European options under stochastic-volatility models in Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Artur Sepp", email = "artursepp@gmail.com"},
]
maintainers = [
    {name = "Artur Sepp", email = "artursepp@gmail.com"},
    {name = "Parviz Rakhmonov", email = "ParvizRZ@gmail.com"},
]
keywords = [
    "stochastic volatility",
    "volatility modeling",
    "option pricing",
    "heston model",
    "log-normal stochastic volatility",
    "monte carlo simulation",
    "fourier transform",
    "quantitative finance",
    "derivatives pricing",
    "implied volatility",
    "volatility surface",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11.5"

dependencies = [
    "vanilla-option-pricers>=2.1.0",
    "numba>=0.60.0",
    "numpy>=2.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
research = [
    "mpmath>=1.3.0",
    "option-chain-analytics[cboe]>=6.0.0",
    "qis>=5.11.0",
]

visualization = [
    "plotly>=5.0.0",
]

numerical = [
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.2",
]

jupyter = [
    "jupyter>=1.0.0",
    "notebook>=6.5.0",
    "jupyterlab>=3.0.0",
    "ipykernel>=6.0.0",
    "ipywidgets>=8.0.0",
]

docs = [
    "sphinx>=8.0,<10.0",
    "furo>=2024.8.6",
    "myst-parser>=4.0,<6.0",
    "sphinxcontrib-mermaid>=1.0",
]

all = [
    "stochvolmodels[research,visualization,numerical,jupyter]",
]

[dependency-groups]
# Contributor-only tools are exact so local and CI verdicts are reproducible.
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-regressions>=2.8.3",
]
lint = [
    "ruff==0.17.4",
    "interrogate==1.7.0",
]
audit = [
    "pip-audit==2.10.1",
]

[project.urls]
Homepage = "https://github.com/ArturSepp/StochVolModels"
Documentation = "https://stochvolmodels.readthedocs.io"
Repository = "https://github.com/ArturSepp/StochVolModels"
Issues = "https://github.com/ArturSepp/StochVolModels/issues"
Changelog = "https://github.com/ArturSepp/StochVolModels/blob/main/CHANGELOG.md"
"JOSS paper" = "https://github.com/ArturSepp/StochVolModels/blob/main/paper.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stochvolmodels*"]
exclude = [
    "tests*",
    "docs*",
    "notebooks*",
    "resources*",
]

[tool.setuptools.exclude-package-data]
"*" = ["README.md"]

[tool.setuptools.package-data]
stochvolmodels = [
    "settings.yaml.example",
    "tests/test_rough_logsv_pricer_regression/test_rough_logsv_pricer_pricing_regression.npz",
]

[tool.pytest.ini_options]
testpaths = ["src/stochvolmodels/tests"]
pythonpath = ["src", "."]
addopts = "-ra -q --tb=short"
markers = [
    "pde_reference: compare with the repository's historical LSV implementation",
    "slow: numerical regression or simulation tests excluded from the fast CI lane",
    "optional_integration: provider or optional-extra contract that skips on a core install",
    "repository_only: documentation, example, or paper contract absent from the wheel",
    "paper_replication: long repository paper-reproduction gate run outside the core suite",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
extend-select = ["TID251", "TID253", "ICN"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# NumPy owns elementary operations; scipy.special owns special functions.
# Only justified imports receive a line-level TID251 exception: the Numba erf
# kernel and cancellation-sensitive fsum in valuation. See CONTRIBUTING.md.
"math".msg = "Use NumPy for elementary operations or scipy.special for special functions; document any required kernel/precision exception on its import line."
"cmath".msg = "Use NumPy with complex inputs for elementary operations, or scipy.special for special functions."
"optimalportfolios".msg = "Subject packages must not depend on each other."
"factorlasso".msg = "Subject packages must not depend on each other."
"trendfollowing".msg = "Subject packages must not depend on each other."
"privateassets".msg = "Subject packages must not depend on each other."
"goal_based_allocation".msg = "Subject packages must not depend on each other."
"bbg_fetch".msg = "A1: stochvolmodels has no declared dependency on bbg_fetch."

[tool.ruff.lint.flake8-tidy-imports]
banned-module-level-imports = [
    "qis",
    "option_chain_analytics",
    "plotly",
    "sklearn",
    "statsmodels",
    "yfinance",
    "yaml",
]

[tool.ruff.lint.flake8-import-conventions.aliases]
numpy = "np"
pandas = "pd"
vanilla_option_pricers = "vop"

[tool.ruff.lint.per-file-ignores]
# Experimental research modules retain dormant derivation variables and imports.
"src/stochvolmodels/pricers/factor_hjm/**" = ["F401", "F841", "TID253"]
"src/stochvolmodels/models/rough_logsv/split_simulation.py" = ["F401"]
# Dedicated optional-data leaf; it is not reachable from the package root.
"src/stochvolmodels/data/fetch_option_chain.py" = ["TID253"]

[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
exclude = [
    "src/stochvolmodels/tests",
    "src/stochvolmodels/pricers/factor_hjm",
    "src/stochvolmodels/pricers/rough_logsv",
    "src/stochvolmodels/models/rough_logsv",
]

[tool.coverage.run]
source = ["stochvolmodels"]
omit = [
    "*/tests/*", "*/examples/*", "*/.agents/*",
]

[tool.coverage.report]
precision = 2
fail_under = 44.5
