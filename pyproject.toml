[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stochvolmodels"
version = "2.2.0"
description = "Fourier-transform pricing, Monte Carlo validation, and calibration of European options under stochastic-volatility models in Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Artur Sepp", email = "artursepp@gmail.com"},
]
maintainers = [
    {name = "Artur Sepp", email = "artursepp@gmail.com"},
    {name = "Parviz Rakhmonov", email = "ParvizRZ@gmail.com"},
]
keywords = [
    "stochastic volatility",
    "volatility modeling",
    "option pricing",
    "heston model",
    "log-normal stochastic volatility",
    "monte carlo simulation",
    "fourier transform",
    "quantitative finance",
    "derivatives pricing",
    "implied volatility",
    "volatility surface",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"

dependencies = [
    "vanilla-option-pricers>=2.0.0",
    "numba>=0.60.0",
    "numpy>=2.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
research = [
    "option-chain-analytics>=5.0.0",
    "qis>=3.5.7",
]

visualization = [
    "plotly>=5.0.0",
]

numerical = [
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
]

jupyter = [
    "jupyter>=1.0.0",
    "notebook>=6.5.0",
    "jupyterlab>=3.0.0",
    "ipykernel>=6.0.0",
    "ipywidgets>=8.0.0",
]

docs = [
    "sphinx>=8.0,<10.0",
    "furo>=2024.8.6",
    "myst-parser>=4.0,<6.0",
]

all = [
    "stochvolmodels[research,visualization,numerical,jupyter]",
]

[dependency-groups]
# Contributor-only tools are exact so local and CI verdicts are reproducible.
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-regressions>=2.8.3",
]
lint = [
    "ruff==0.16.2",
    "interrogate==1.7.0",
]
audit = [
    "pip-audit==2.10.1",
]

[project.urls]
Homepage = "https://github.com/ArturSepp/StochVolModels"
Documentation = "https://stochvolmodels.readthedocs.io/en/latest/"
Repository = "https://github.com/ArturSepp/StochVolModels.git"
Issues = "https://github.com/ArturSepp/StochVolModels/issues"
Changelog = "https://github.com/ArturSepp/StochVolModels/blob/main/CHANGELOG.md"
Contributing = "https://github.com/ArturSepp/StochVolModels/blob/main/CONTRIBUTING.md"
"JOSS paper" = "https://github.com/ArturSepp/StochVolModels/blob/main/paper.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stochvolmodels*"]
exclude = [
    "stochvolmodels.pde_solvers*",
    "tests*",
    "docs*",
    "notebooks*",
    "resources*",
    "stochvolmodels.run_local*",
    "stochvolmodels.*.run_local*",
    "stochvolmodels.*.*.run_local*",
]

[tool.setuptools.package-data]
stochvolmodels = ["tests/*/*.npz"]

[tool.pytest.ini_options]
testpaths = ["src/stochvolmodels/tests"]
pythonpath = ["src"]
addopts = "-ra -q --tb=short"
markers = [
    "slow: numerical regression or simulation tests excluded from the fast CI lane",
    "optional_integration: provider or optional-extra contract that skips on a core install",
    "repository_only: documentation, example, or paper contract absent from the wheel",
    "paper_replication: long repository paper-reproduction gate run outside the core suite",
]

[tool.ruff]
line-length = 100
exclude = ["src/stochvolmodels/pde_solvers"]

[tool.ruff.lint]
select = ["E", "F", "W"]
extend-select = ["TID251", "TID253", "ICN"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"optimalportfolios".msg = "Subject packages must not depend on each other."
"factorlasso".msg = "Subject packages must not depend on each other."
"trendfollowing".msg = "Subject packages must not depend on each other."
"privateassets".msg = "Subject packages must not depend on each other."
"goal_based_allocation".msg = "Subject packages must not depend on each other."

[tool.ruff.lint.flake8-tidy-imports]
banned-module-level-imports = [
    "qis",
    "option_chain_analytics",
    "plotly",
    "sklearn",
    "statsmodels",
    "yfinance",
    "yaml",
]

[tool.ruff.lint.flake8-import-conventions.aliases]
numpy = "np"
pandas = "pd"

[tool.ruff.lint.per-file-ignores]
# Experimental research modules retain dormant derivation variables and imports.
"src/stochvolmodels/pricers/factor_hjm/**" = ["F401", "F841", "TID253"]
"src/stochvolmodels/pricers/rough_logsv/split_simulation.py" = ["F401"]
# Dedicated optional-data leaf; it is not reachable from the package root.
"src/stochvolmodels/data/fetch_option_chain.py" = ["TID253"]
# Development runners are optional-extra entry points and are not imported by the package root.
"src/stochvolmodels/**/run_local/*_run.py" = ["TID253"]

[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
exclude = [
    "src/stochvolmodels/tests",
    "src/stochvolmodels/pde_solvers",
    "src/stochvolmodels/pricers/factor_hjm",
    "src/stochvolmodels/pricers/rough_logsv",
    "src/stochvolmodels/data/run_local",
    "src/stochvolmodels/fitters/run_local",
    "src/stochvolmodels/pricers/run_local",
    "src/stochvolmodels/pricers/logsv/run_local",
    "src/stochvolmodels/pricers/rough_logsv/run_local",
]

[tool.coverage.run]
source = ["stochvolmodels"]
omit = ["*/tests/*", "*/examples/*", "*/run_local/*", "*/pde_solvers/*"]

[tool.coverage.report]
precision = 2
fail_under = 44.5
